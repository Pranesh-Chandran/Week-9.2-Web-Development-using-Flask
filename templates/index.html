<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Battery Health Prediction</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:420px;
            background:#fff;
            padding:35px;
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            color:#1b5e20;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:gray;
            margin-bottom:25px;
            font-size:14px;
        }

        .input-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:15px;
            transition:0.3s;
        }

        input:focus{
            outline:none;
            border-color:#4CAF50;
            box-shadow:0 0 8px rgba(76,175,80,0.4);
        }

        .btn{
            width:100%;
            padding:14px;
            background:#4CAF50;
            color:white;
            font-size:18px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            background:#2e7d32;
            transform:scale(1.03);
        }

        .footer{
            margin-top:20px;
            text-align:center;
            color:gray;
            font-size:13px;
        }

        @media(max-width:500px){
            .container{
                width:90%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🔋 EV Battery Health Prediction</h2>
    <p>Enter battery parameters to predict battery health.</p>

    <form action="/predict" method="POST">

        <div class="input-group">
            <label>Battery Capacity (Cycles)</label>
            <input type="number" step="any" name="Cycles" placeholder="Enter Charge Cycles (165)" required>
        </div>

        <div class="input-group">
            <label>Voltage (V)</label>
            <input type="number" step="any" name="Voltage_V" placeholder="Enter Voltage (3.43)" required>
        </div>

        <div class="input-group">
            <label>Current (A)</label>
            <input type="number" step="any" name="Current_A" placeholder="Enter Current (3.45)" required>
        </div>

        <div class="input-group">
            <label>Temperature (°C)</label>
            <input type="number" step="any" name="Temperature_C" placeholder="Enter Temperature (29.2)" required>
        </div>

        <div class="input-group">
            <label>Internal Resistance (mΩ)</label>
            <input type="number" step="any" name="Internal_Resistance_mOhm" placeholder="Enter Internal Resistance(40.2)" required>
        </div>

        <div class="input-group">
            <label>Capacity (Ah)</label>
            <input type="number" step="any" name="Capacity_Ah" placeholder="Enter Capacity(47.5)" required>
        </div>

        <button type="submit" class="btn">Predict Battery Health</button>

    </form>

    <div class="footer">
        EV Battery Health Monitoring System
    </div>

</div>

</body>
</html>
